<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimpleSell — Join the Waitlist</title>
  <meta name="description" content="Sell products online for as low as $5 a month. Join the waitlist to be among the first to launch your store." />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Brand tokens ── */
    :root {
      --rust:    #A55334;
      --olive:   #6B7D4B;
      --charcoal:#2C2C2C;
      --linen:   #F5F0E1;
      --mustard: #D9A441;
      --white:   #FFFFFF;

      --font-sans: 'Inter', system-ui, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;
    }

    /* ── Base ── */
    html, body {
      height: 100%;
      background: var(--linen);
      color: var(--charcoal);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(245, 240, 225, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(165, 83, 52, 0.2);
    }
    .nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-text {
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 18px;
      color: var(--charcoal);
      letter-spacing: -0.3px;
    }

    /* ── Main ── */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .content {
      max-width: 640px;
      width: 100%;
      text-align: center;
    }

    /* Gus illustration */
    .gus-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 32px;
    }
    .gus-wrap svg {
      width: 120px;
      height: 120px;
    }

    /* Headline */
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      font-weight: 700;
      color: var(--charcoal);
      line-height: 1.15;
      margin-bottom: 20px;
    }

    /* Subheadline */
    .sub {
      font-size: 1.2rem;
      color: rgba(44, 44, 44, 0.7);
      margin-bottom: 48px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }

    /* ── Form ── */
    .form {
      max-width: 480px;
      margin: 0 auto;
    }
    .input-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 540px) {
      .input-row { flex-direction: column; }
    }

    .input-wrap {
      position: relative;
      flex: 1;
    }
    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      color: rgba(44, 44, 44, 0.4);
      pointer-events: none;
    }
    .email-input {
      width: 100%;
      padding: 16px 16px 16px 48px;
      background: var(--white);
      border: 2px solid rgba(44, 44, 44, 0.2);
      border-radius: 12px;
      font-family: var(--font-sans);
      font-size: 1rem;
      color: var(--charcoal);
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }
    .email-input::placeholder { color: rgba(44, 44, 44, 0.4); }
    .email-input:focus {
      border-color: var(--rust);
      box-shadow: 0 0 0 4px rgba(165, 83, 52, 0.12);
    }
    .email-input:disabled { opacity: 0.6; cursor: not-allowed; }

    .submit-btn {
      padding: 16px 28px;
      background: var(--rust);
      color: var(--linen);
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      white-space: nowrap;
      min-width: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(165, 83, 52, 0.25);
      transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
    }
    .submit-btn:hover:not(:disabled) {
      background: #8f4628;
      box-shadow: 0 6px 20px rgba(165, 83, 52, 0.35);
      transform: translateY(-1px);
    }
    .submit-btn:active:not(:disabled) { transform: translateY(0); }
    .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    /* Spinner */
    .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(245, 240, 225, 0.4);
      border-top-color: var(--linen);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Check icon */
    .check-icon { width: 20px; height: 20px; }

    /* Status message */
    .status-msg {
      padding: 14px 18px;
      border-radius: 12px;
      border: 2px solid;
      font-size: 0.92rem;
      text-align: left;
      display: none;
    }
    .status-msg.visible { display: block; }
    .status-msg.success {
      background: rgba(107, 125, 75, 0.1);
      border-color: rgba(107, 125, 75, 0.35);
      color: var(--olive);
    }
    .status-msg.error {
      background: rgba(165, 83, 52, 0.08);
      border-color: rgba(165, 83, 52, 0.3);
      color: var(--rust);
    }

    /* ── Trust badges ── */
    .trust {
      margin-top: 48px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 24px;
      font-size: 0.875rem;
      color: rgba(44, 44, 44, 0.6);
    }
    .trust-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .trust-check {
      width: 16px;
      height: 16px;
      color: var(--olive);
      flex-shrink: 0;
    }

    /* ── Footer ── */
    .footer {
      border-top: 1px solid rgba(165, 83, 52, 0.2);
      padding: 24px;
      text-align: center;
    }
    .footer p {
      font-size: 0.875rem;
      color: rgba(44, 44, 44, 0.55);
    }

    /* ── Fade-in animation ── */
    .fade-in {
      animation: fadeIn 0.5s ease-out both;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

        <!-- Headline -->
        <h1>Pay once, sell online forever.</h1>

        <!-- Subheadline -->
        <p class="sub">
          Join the waitlist to be among the first to launch your store when we go live.
        </p>

        <!-- Email Form -->
        <form class="form" id="waitlistForm" novalidate>
          <div class="input-row">
            <div class="input-wrap">
              <!-- Mail icon -->
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
              <input
                id="emailInput"
                class="email-input"
                type="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
              />
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">
              <span id="btnLabel">Join the waitlist</span>
            </button>
          </div>

          <!-- Status message -->
          <div class="status-msg" id="statusMsg" role="alert" aria-live="polite"></div>
        </form>
  
        <!-- Trust indicators -->
        <div class="trust">
          <div class="trust-item">
            <svg class="trust-check" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
            <span>No spam, ever</span>
          </div>
          <div class="trust-item">
            <svg class="trust-check" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
            <span>Early access when we launch</span>
          </div>
          <div class="trust-item">
            <svg class="trust-check" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
            </svg>
            <span>Special launch pricing</span>
          </div>
        </div>

    <!-- Footer -->
    <footer class="footer">
      <p>Powered by SimpleSell &bull; Selling online shouldn't be complicated</p>
    </footer>

  </div><!-- /.page -->

  <script>
    // ── Fill in your Supabase project details here ──────────────────────────
    // Find these in: Supabase dashboard → Project Settings → API
    const SUPABASE_URL      = 'https://bxmxnhecoiqvdreapcdd.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_SlRijxKHD0doZi6SQbFA7Q_aglFo3b2';
    // ────────────────────────────────────────────────────────────────────────

    const form      = document.getElementById('waitlistForm');
    const emailInput = document.getElementById('emailInput');
    const submitBtn = document.getElementById('submitBtn');
    const btnLabel  = document.getElementById('btnLabel');
    const statusMsg = document.getElementById('statusMsg');

    const spinnerHTML = `<div class="spinner"></div><span>Joining...</span>`;
    const successHTML = `
      <svg class="check-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
      <span>Joined!</span>`;

    function showStatus(text, type) {
      statusMsg.textContent = text;
      statusMsg.className = `status-msg visible ${type}`;
    }
    function hideStatus() {
      statusMsg.className = 'status-msg';
    }

    emailInput.addEventListener('input', () => {
      hideStatus();
      submitBtn.disabled = false;
      btnLabel.textContent = 'Join the waitlist';
      submitBtn.innerHTML = `<span id="btnLabel">Join the waitlist</span>`;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideStatus();

      const email = emailInput.value.trim();
      if (!email) {
        showStatus('Please enter your email address.', 'error');
        return;
      }

      // Loading state
      submitBtn.disabled = true;
      submitBtn.innerHTML = spinnerHTML;

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/waitlist`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=minimal',
          },
          body: JSON.stringify({ email: email.toLowerCase() }),
        });

        if (res.ok) {
          submitBtn.innerHTML = successHTML;
          emailInput.value = '';
          showStatus("Thanks for joining! We'll be in touch soon.", 'success');
        } else {
          const errorBody = await res.text();
          submitBtn.disabled = false;
          submitBtn.innerHTML = `<span>Join the waitlist</span>`;
          if (res.status === 409 || errorBody.includes('23505')) {
            showStatus('This email is already on the waitlist!', 'error');
          } else {
            showStatus('Something went wrong. Please try again.', 'error');
          }
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Join the waitlist</span>`;
        showStatus('Network error. Please check your connection and try again.', 'error');
      }
    });
  </script>
